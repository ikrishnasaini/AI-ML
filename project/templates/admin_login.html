{% extends "base.html" %}

{% block title %}Admin Login - KGS & Company{% endblock %}

{% block content %}
<div class="container py-5" style="min-height: 100vh; display: flex; align-items: center;">
    <div class="row justify-content-center w-100">
        <div class="col-lg-4 col-md-6">
            <div class="card border-0 shadow-lg" style="border-top: 5px solid #d4af37;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-lock" style="font-size: 3rem; color: #1a3a52;"></i>
                        <h3 class="text-navy mt-3">Admin Portal</h3>
                        <p class="text-muted">KGS & Company</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}

                    <form method="POST">
                        <div class="form-group mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required 
                                   placeholder="Enter username" autofocus>
                        </div>

                        <div class="form-group mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required 
                                   placeholder="Enter password">
                        </div>

                        <button type="submit" class="btn btn-navy w-100 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>

                    <div class="alert alert-info mt-4 small">
                        <strong>Demo Credentials:</strong><br>
                        Username: <code>admin</code><br>
                        Password: <code>admin@123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
